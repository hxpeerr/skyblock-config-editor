name: Build & release

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - rust/**
      - features.jsonc
      - skyblock_config_manager.py
      - packaging/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable

      - name: Check the versions (and the tag) match
        shell: python
        run: |
          import os, re, sys, tomllib
          py = re.search(r'^__version__ = "(.+?)"', open("skyblock_config_manager.py", encoding="utf-8").read(), re.M).group(1)
          rs = tomllib.load(open("rust/Cargo.toml", "rb"))["package"]["version"]
          errors = []
          if py != rs:
              errors.append(f"skyblock_config_manager.py is {py} but rust/Cargo.toml is {rs}; make them the same")
          tag = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ.get("GITHUB_REF", "").startswith("refs/tags/") and tag != "v" + rs:
              errors.append(f"Tag {tag} doesn't match version {rs}: tag the release v{rs}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(1 if errors else 0)

      - name: Check features.jsonc matches the Python tables
        run: python rust/tools/export_features.py --check

      - name: Unit tests
        working-directory: rust
        run: cargo test --no-default-features

      - name: Compare with the Python version
        run: |
          cargo build --manifest-path rust/Cargo.toml --no-default-features --bin scm-dump
          python rust/tools/parity.py rust/target/debug/scm-dump

  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Update Rust
        run: rustup update stable --no-self-update && rustup default stable

      - name: Install the Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q libx11-dev libxkbcommon-dev libwayland-dev

      - name: Build (Windows, Linux)
        if: runner.os != 'macOS'
        working-directory: rust
        run: cargo build --release --bin SkyblockConfigManager

      - name: Build (macOS, one app for Apple and Intel chips)
        if: runner.os == 'macOS'
        working-directory: rust
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --bin SkyblockConfigManager --target aarch64-apple-darwin
          cargo build --release --bin SkyblockConfigManager --target x86_64-apple-darwin
          mkdir -p target/release
          lipo -create -output target/release/SkyblockConfigManager \
            target/aarch64-apple-darwin/release/SkyblockConfigManager target/x86_64-apple-darwin/release/SkyblockConfigManager

      - name: Check the .exe starts and loads a config folder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "smoke"
          New-Item -ItemType Directory -Force -Path (Join-Path $dir "config") | Out-Null
          Copy-Item rust/target/release/SkyblockConfigManager.exe $dir
          Set-Content -Path (Join-Path $dir "config/skyblocker.json") -Value '{"quickNav": {"enableQuickNav": true}}'
          $exe = Start-Process -FilePath (Join-Path $dir "SkyblockConfigManager.exe") -WorkingDirectory $dir -PassThru
          $null = $exe.Handle

          $settings = Join-Path $dir "skyblock_config_manager.settings.json"
          $deadline = (Get-Date).AddSeconds(120)
          while (-not (Test-Path $settings) -and -not $exe.HasExited -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          Start-Sleep -Seconds 3
          try {
            if ($exe.HasExited) { throw "The app closed by itself (exit code $($exe.ExitCode))." }
            if (-not (Test-Path $settings)) { throw "The app didn't load the test config folder within 2 minutes." }
            $loaded = (Get-Content $settings -Raw | ConvertFrom-Json).config_dir
            if ($loaded -ne (Join-Path $dir "config")) { throw "The app loaded '$loaded' instead of the test config folder." }
            $window = (Get-Process -Id $exe.Id).MainWindowTitle
            Write-Host "OK: the app started and loaded $loaded (window title: '$window')."
          } finally {
            Stop-Process -Id $exe.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          mkdir -p dist
          case "$RUNNER_OS" in
            Windows)
              cp rust/target/release/SkyblockConfigManager.exe dist/
              (cd dist && 7z a -tzip -mx=9 SkyblockConfigManager.zip SkyblockConfigManager.exe > /dev/null)
              ;;
            macOS)
              app=dist/SkyblockConfigManager.app
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp rust/target/release/SkyblockConfigManager "$app/Contents/MacOS/"
              sed "s/{version}/$version/g" packaging/Info.plist > "$app/Contents/Info.plist"
              ( set -e
                mkdir -p icon.iconset
                sips -s format png packaging/icon.ico --out icon.png > /dev/null
                for s in 16 32 128 256 512; do
                  sips -z $s $s icon.png --out icon.iconset/icon_${s}x${s}.png > /dev/null
                  sips -z $((s * 2)) $((s * 2)) icon.png --out icon.iconset/icon_${s}x${s}@2x.png > /dev/null
                done
                iconutil -c icns icon.iconset -o "$app/Contents/Resources/icon.icns"
              ) || echo "::warning::Couldn't make the macOS app icon"
              codesign --force --deep --sign - "$app"
              (cd dist && ditto -c -k --keepParent SkyblockConfigManager.app SkyblockConfigManager-macOS.zip && rm -rf SkyblockConfigManager.app)
              ;;
            Linux)
              cp rust/target/release/SkyblockConfigManager dist/
              (cd dist && zip -9 -q SkyblockConfigManager-Linux.zip SkyblockConfigManager && rm SkyblockConfigManager)
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: SkyblockConfigManager-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the GitHub Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Write the release notes
        run: |
          rustup update stable --no-self-update > /dev/null
          python3 - <<'PY'
          import hashlib, subprocess
          files = ["SkyblockConfigManager.exe", "SkyblockConfigManager.zip",
                   "SkyblockConfigManager-macOS.zip", "SkyblockConfigManager-Linux.zip"]
          sums = "\n".join(f"- `{f}`: `{hashlib.sha256(open('dist/' + f, 'rb').read()).hexdigest()}`" for f in files)
          rust = " ".join(subprocess.run(["rustc", "--version"], capture_output=True, text=True).stdout.split()[:2])
          notes = open("packaging/release_notes.md", encoding="utf-8").read()
          notes = notes.replace("{checksums}", sums).replace("{rust}", rust.replace("rustc", "Rust"))
          open("dist/release_notes.md", "w", encoding="utf-8").write(notes)
          print(sums)
          PY

      - name: Create the release, or add the files to one published by hand
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/SkyblockConfigManager.exe dist/SkyblockConfigManager.zip dist/SkyblockConfigManager-macOS.zip dist/SkyblockConfigManager-Linux.zip)
          if body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null); then
            gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            if [ -z "$body" ]; then
              gh release edit "$TAG" --notes-file dist/release_notes.md --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$TAG" "${files[@]}" --verify-tag --repo "$GITHUB_REPOSITORY" \
              --title "SkyBlock Config Manager ${TAG#v}" --notes-file dist/release_notes.md
          fi
